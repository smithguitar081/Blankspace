<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 24px; display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .label { font-size: 11px; color: #444; }
  a.btn { display: inline-block; color: #fff; background: transparent; border: 1px solid #fff; padding: 10px 20px; text-decoration: none; font-size: 1rem; font-family: inherit; transition: 0.3s; }
  a.btn.hover-state { background: #fff; color: #000; }
</style></head><body>
  <div class="group"><a class="btn">Buy MP3 – $1.00</a><div class="label">Default</div></div>
  <div class="group"><a class="btn hover-state">Buy MP3 – $1.00</a><div class="label">Hover (inverted)</div></div>
  <div class="group"><a class="btn" style="opacity:0.4;pointer-events:none">Buy MP3 – $1.00</a><div class="label">Disabled</div></div>
</body></html>
