<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 24px; display: flex; gap: 24px; align-items: center; }
  .group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .label { font-size: 11px; color: #555; text-align: center; }
  a.btn-buy { display: inline-block; color: #fff; background: transparent; border: 1px solid #fff; padding: 10px 20px; text-decoration: none; font-size: 14px; font-family: inherit; }
  a.btn-buy.hover { background: #fff; color: #000; }
  .nav-link { color: #fff; font-size: 15px; text-decoration: none; font-family: inherit; }
  .nav-link.hover { opacity: 0.7; }
  .divider { width: 1px; height: 60px; background: #222; }
</style></head><body>
  <div class="group"><a class="btn-buy">Buy MP3 – $1.00</a><div class="label">Button default</div></div>
  <div class="group"><a class="btn-buy hover">Buy MP3 – $1.00</a><div class="label">Button hover</div></div>
  <div class="divider"></div>
  <div class="group"><a class="nav-link">About</a><div class="label">Nav link default</div></div>
  <div class="group"><a class="nav-link hover">About</a><div class="label">Nav link hover (0.7 opacity)</div></div>
</body></html>
