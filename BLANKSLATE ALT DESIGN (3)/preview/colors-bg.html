<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 100px; height: 60px; border: 1px solid #333; }
  .label { color: #aaa; font-size: 11px; }
  .name { color: #fff; font-size: 12px; font-weight: 600; }
</style></head><body>
  <div class="swatch"><div class="chip" style="background:#000"></div><div class="name">--bg-primary</div><div class="label">#000000</div></div>
  <div class="swatch"><div class="chip" style="background:#000;outline:1px solid #333"></div><div class="name">--bg-navbar</div><div class="label">#000000</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(0,0,0,0.4);backdrop-filter:blur(1px);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#555 0,#555 1px,transparent 0,transparent 50%) 0 0 / 8px 8px"></div></div><div class="name">--bg-hero-overlay</div><div class="label">rgba(0,0,0,0.4)</div></div>
  <div class="swatch"><div class="chip" style="background:#111"></div><div class="name">--color-gray-900</div><div class="label">#111111</div></div>
  <div class="swatch"><div class="chip" style="background:#333"></div><div class="name">--color-gray-700</div><div class="label">#333333</div></div>
  <div class="swatch"><div class="chip" style="background:#555"></div><div class="name">--color-gray-500</div><div class="label">#555555</div></div>
</body></html>
