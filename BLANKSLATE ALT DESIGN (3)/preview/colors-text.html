<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .chip { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #222; flex-shrink: 0; }
  .info { display: flex; flex-direction: column; }
  .name { font-size: 12px; font-weight: 600; }
  .label { font-size: 11px; color: #555; }
  .sample { font-size: 14px; margin-left: auto; }
</style></head><body>
  <div class="row"><div class="chip" style="background:#fff"></div><div class="info"><div class="name" style="color:#fff">--fg-primary</div><div class="label">#ffffff</div></div><div class="sample" style="color:#fff">Primary text</div></div>
  <div class="row"><div class="chip" style="background:#ccc"></div><div class="info"><div class="name" style="color:#ccc">--fg-secondary</div><div class="label">#cccccc</div></div><div class="sample" style="color:#ccc">Tagline / subtitle</div></div>
  <div class="row"><div class="chip" style="background:#777"></div><div class="info"><div class="name" style="color:#777">--fg-muted</div><div class="label">#777777</div></div><div class="sample" style="color:#777">Footer / meta</div></div>
  <div class="row"><div class="chip" style="background:#333"></div><div class="info"><div class="name" style="color:#555">--fg-border</div><div class="label">#333333</div></div><div class="sample" style="color:#555">Border / rule</div></div>
</body></html>
