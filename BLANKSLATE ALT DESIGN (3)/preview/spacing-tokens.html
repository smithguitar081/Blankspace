<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  body { margin: 0; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { background: #fff; height: 10px; }
  .label { color: #555; font-size: 11px; min-width: 180px; }
  .val { color: #fff; font-size: 12px; font-weight: 600; min-width: 50px; }
</style></head><body>
  <div class="row"><div class="bar" style="width:40px"></div><div class="val">40px</div><div class="label">Section / navbar horizontal padding</div></div>
  <div class="row"><div class="bar" style="width:40px"></div><div class="val">40px</div><div class="label">Hero overlay padding</div></div>
  <div class="row"><div class="bar" style="width:30px"></div><div class="val">30px</div><div class="label">Nav link gap</div></div>
  <div class="row"><div class="bar" style="width:20px"></div><div class="val">20px</div><div class="label">Track margin / button padding-x</div></div>
  <div class="row"><div class="bar" style="width:10px"></div><div class="val">10px</div><div class="label">Button padding-y</div></div>
  <div class="row"><div class="bar" style="width:70px"></div><div class="val">70px</div><div class="label">Navbar height</div></div>
</body></html>
